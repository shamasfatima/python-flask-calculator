
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Calculator</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
     <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #050816, #14213d);
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
}

.calculator {
    width: 100%;
    max-width: 380px;
    padding: 30px;
    border: 1px solid #00d9ff;
    border-radius: 20px;
    background: #0b1428;
    box-shadow: 0 0 25px #00d9ff30;
}

h1 {
    text-align: center;
    color: #00d9ff;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aabbd3;
    margin-bottom: 25px;
}

input, select {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: 1px solid #304565;
    border-radius: 8px;
    background: #101e35;
    color: white;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #0077ff, #00d9ff);
    color: #06101e;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 18px #00d9ff80;
}

.result {
    margin-top: 22px;
    padding: 18px;
    text-align: center;
    border: 1px solid #00d9ff;
    border-radius: 10px;
    overflow-wrap: anywhere;
}

.result p {
    color: #aabbd3;
}

.result h2 {
    color: #00e5ff;
    font-size: 30px;
    margin-top: 8px;
}

.error {
    margin-top: 15px;
    padding: 12px;
    color: #ffbaba;
    background: #401b25;
    border-radius: 8px;
    overflow-wrap: anywhere;
}

     </style>
</head>
<body>

<div class="calculator">
    <h1>Calculator</h1>
    <p class="subtitle">Python + Flask</p>

    <form method="POST">
        <input type="number" step="any" name="number1"
               placeholder="First number" required>

        <select name="operation" id="operation" onchange="toggleInput()">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
            <option value="square">Square (x²)</option>
            <option value="%">Remainder (%)</option>
        </select>

        <input type="number" step="any" name="number2"
               id="number2" placeholder="Second number">

        <button type="submit">Calculate</button>
    </form>

    {% if result is not none %}
        <div class="result">
            <p>Result</p>
            <h2>{{ result }}</h2>
        </div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
</div>

<script>
function toggleInput() {
    const square = document.getElementById("operation").value === "square";
    const input = document.getElementById("number2");

    input.style.display = square ? "none" : "block";
    input.required = !square;
}

toggleInput();
</script>

</body>
</html>
